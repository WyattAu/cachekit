name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: b
      all-features: true
      loom: false
      wasm: false
      miri: false

  # Backend integration suites: sqlite fully local (tempdir), redis against
  # the job's service container (fresh per run). Tests use distinct key
  # prefixes so they share one server safely.
  integration:
    name: Integration (sqlite + redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sqlite backend suite
        run: cargo test --features sqlite --test sqlite_backend
      - name: redis backend suite (service container)
        env:
          CACHEKIT_TEST_REDIS_URL: redis://127.0.0.1:6379/
        run: cargo test --features redis --test redis_backend
