[package]
name = "cache-pal"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Unified caching for Rust — in-memory (moka) and Redis backends with TTL, stale-while-revalidate, and eviction listeners"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/cachekit"
keywords = ["cache", "moka", "redis", "ttl", "in-memory"]
categories = ["caching"]
exclude = ["/target"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
async-trait = "0.1"

[dependencies.moka]
version = "0.12"
optional = true
features = ["future"]

[dependencies.redis]
version = "1.2"
optional = true
features = ["tokio-comp", "connection-manager"]

[dependencies.rusqlite]
version = "0.31"
optional = true
features = ["bundled"]

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.metrics]
version = "0.24"
optional = true

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
criterion = { version = "0.5", features = ["html_reports"] }
# sqlite_backend.rs: on-disk persistence across a reopen.
tempfile = "3"
# redis_backend.rs: talks to the CI job's redis service container (or any
# local Redis; see tests/redis_backend.rs for the connection env var).


[features]
default = ["in-memory"]
in-memory = ["dep:moka"]
redis = ["dep:redis"]
sqlite = ["dep:rusqlite"]
tracing = ["dep:tracing"]
metrics = ["dep:metrics"]

[[bench]]
name = "cache_bench"
harness = false

[[test]]
name = "sqlite_backend"
required-features = ["sqlite"]

[[test]]
name = "redis_backend"
required-features = ["redis"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
