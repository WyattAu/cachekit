# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 + RUSTSEC-2026-0386: SQLite CVE-2026-119375 via
    # bundled libsqlite3-sys 0.28 (pinned by rusqlite 0.31; no compatible
    # upgrade in-range as of 2026-11-18). Exposure is the local/embedded
    # sqlite cache backend, not a network-facing service. Re-evaluate on
    # the rusqlite 0.32+ upgrade.
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0386",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
